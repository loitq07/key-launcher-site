<header id="site-navigation" data-page-kind="{{kind}}" data-locale="{{locale}}" class="sticky top-0 z-50 w-full border-b border-zinc-200 dark:border-zinc-800/80 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <a href="{{home}}" data-nav-home class="flex items-center gap-2.5 group shrink-0">
            <img src="/assets/logo_key_launcher.png" alt="Key Launcher" width="32" height="32" class="w-8 h-8 rounded-lg transition-transform group-hover:scale-105">
            <span class="font-display font-bold tracking-tight text-zinc-900 dark:text-white leading-none">Key Launcher</span>
        </a>
        <nav aria-label="{{primaryLabel}}" class="hidden lg:flex items-center gap-5 text-sm font-medium text-zinc-500 dark:text-zinc-400">
            {{desktopLinks}}
            <details id="nav-more" class="site-nav-more relative group">
                <summary class="flex items-center gap-1 py-2 cursor-pointer hover:text-zinc-900 dark:hover:text-white">
                    <span data-nav-label="more">{{more}}</span>
                    <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </summary>
                <div class="absolute left-0 top-full w-48 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-xl py-2">
                    {{moreLinks}}
                </div>
            </details>
            <a href="https://www.keylauncher.app/help" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-900 dark:hover:text-white transition-colors"><span data-nav-label="help">{{help}}</span></a>
        </nav>
        <div class="flex items-center gap-2 sm:gap-3">
            <label for="language-select" class="sr-only" data-nav-label="languageLabel">{{languageLabel}}</label>
            <select id="language-select" aria-label="{{languageLabel}}" class="h-9 w-16 sm:w-28 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 px-2 text-xs font-semibold text-zinc-700 dark:text-zinc-300 cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500/40">{{languageOptions}}</select>
            <button id="theme-toggle" type="button" aria-label="{{themeLabel}}" class="w-9 h-9 flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 cursor-pointer active:scale-95 transition-all duration-200">
                <svg aria-hidden="true" class="hidden dark:block" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                <svg aria-hidden="true" class="dark:hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
            </button>
            <a href="https://play.google.com/store/apps/details?id=com.loitran.minimalt9launcher.free" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex h-9 items-center justify-center px-4 rounded-lg text-xs font-semibold bg-zinc-900 dark:bg-white text-white dark:text-black hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-colors font-display"><span data-nav-label="downloadText">{{downloadText}}</span></a>
            <button id="mobile-menu-btn" type="button" aria-label="{{menuLabel}}" aria-controls="mobile-menu" aria-expanded="false" class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </div>
    <nav id="mobile-menu" aria-label="{{mobileLabel}}" class="hidden lg:hidden border-t border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 px-4 py-4 text-sm font-medium text-zinc-600 dark:text-zinc-400">
        <div class="grid grid-cols-2 gap-2 pb-3 border-b border-zinc-100 dark:border-zinc-800">{{mobileLinks}}</div>
        <div class="flex flex-col gap-1 py-3">{{mobileMoreLinks}}<a href="https://www.keylauncher.app/help" target="_blank" rel="noopener noreferrer" class="px-3 py-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900"><span data-nav-label="help">{{help}}</span></a></div>
        <a href="https://play.google.com/store/apps/details?id=com.loitran.minimalt9launcher.free" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center w-full px-4 py-2.5 rounded-lg bg-brand-500 text-black font-display font-bold text-sm"><span data-nav-label="downloadText">{{downloadText}}</span></a>
    </nav>
</header>
